apiVersion: apps/v1
kind: Deployment
metadata:
  name: kartrack
  namespace: kartrack
  labels:
    app.kubernetes.io/name: kartrack
    app.kubernetes.io/version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kartrack
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0       # zero-downtime: novo pod sobe antes do antigo sair
  template:
    metadata:
      labels:
        app: kartrack
        app.kubernetes.io/name: kartrack
        app.kubernetes.io/version: v1
    spec:
      # Aguarda o volume NFS estar montado antes de iniciar o container
      initContainers:
        - name: init-uploads-dir
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /app/uploads/vehicles
              echo "Upload directories ready."
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads

      containers:
        - name: kartrack
          image: kiwel/kartrack:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: TZ
              value: "America/Sao_Paulo"
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kartrack-secret
                  key: SECRET_KEY
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: kartrack-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kartrack-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: kartrack-secret
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: kartrack-secret
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: kartrack-secret
                  key: DB_NAME

          volumeMounts:
            - name: uploads
              mountPath: /app/uploads

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: kartrack-uploads-pvc

      # Garante que o pod só vai para nodes com acesso NFS
      # (em single-node k3s isso é redundante mas é boa prática)
      terminationGracePeriodSeconds: 30
