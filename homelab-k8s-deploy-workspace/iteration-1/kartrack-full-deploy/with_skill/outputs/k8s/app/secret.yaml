# Replace all <CHANGE_ME> values before applying
# NUNCA commitar este arquivo com valores reais no git
# Use: grep -r '<' k8s/app/secret.yaml  para listar todos os placeholders
apiVersion: v1
kind: Secret
metadata:
  name: kartrack-secret
  namespace: kartrack
  labels:
    app.kubernetes.io/name: kartrack
type: Opaque
stringData:
  # Chave secreta para assinatura de tokens JWT
  # Gere com: python -c "import secrets; print(secrets.token_hex(32))"
  SECRET_KEY: "<CHANGE_ME>"

  # Credenciais do MySQL externo (VM 192.168.1.50)
  DB_USER: "kartrack"
  DB_PASSWORD: "<CHANGE_ME>"
  DB_HOST: "192.168.1.50"
  DB_PORT: "3306"
  DB_NAME: "kartrack"
